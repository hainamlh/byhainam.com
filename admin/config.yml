backend:
  name: github
  repo: hainamlh/byhainam.com
  branch: main
  base_url: https://byhainam-oauth.hainamlh.workers.dev

# Nơi lưu ảnh khi anh chèn vào bài viết
media_folder: "uploads"
public_folder: "/uploads"

site_url: https://byhainam.com
display_url: https://byhainam.com
logo_url: /avatar.jpg

locale: "vi"

collections:
  - name: "letters"
    label: "Letters (Blog)"
    label_singular: "Bài viết"
    folder: "content/letters"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "Theo năm"
        field: date
        pattern: '\d{4}'
      - label: "Theo tháng"
        field: date
        pattern: '\d{4}-\d{2}'
    editor:
      preview: false
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Mô tả ngắn (hiện dưới tiêu đề & ở thẻ bài viết)", name: "dek", widget: "text" }
      - { label: "Thời gian đọc", name: "read", widget: "string", default: "3 phút đọc" }
      - label: "Hình ảnh tiêu đề (hiện ở thẻ bài viết ngoài trang chủ)"
        name: "image"
        widget: "image"
        required: false
        hint: "Nếu không chọn ảnh, trang chủ sẽ tự dùng icon + màu nền bên dưới."
      - label: "Màu thẻ minh hoạ"
        name: "bg"
        widget: "select"
        default: "light"
        options:
          - { label: "Tối (đen)", value: "dark" }
          - { label: "Sáng (trắng)", value: "light" }
          - { label: "Xanh lá nhạt", value: "light-green" }
          - { label: "Đỏ nhạt", value: "light-red" }
      - label: "Tuỳ chỉnh hiển thị bài viết"
        name: "display"
        widget: "object"
        collapsed: true
        required: false
        hint: "Để trống mục nào thì bài viết dùng mặc định của site."
        fields:
          - { label: "Màu nền trang bài viết", name: "postBg", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Ví dụ #000000 hoặc #FFFFFF" }
          - { label: "Màu chữ nội dung", name: "postColor", widget: "color", required: false, allowInput: true, enableAlpha: false }
          - label: "Cỡ chữ nội dung"
            name: "fontSize"
            widget: "select"
            required: false
            options:
              - { label: "Nhỏ (15px)", value: "15" }
              - { label: "Vừa (17px — mặc định)", value: "17" }
              - { label: "Lớn (19px)", value: "19" }
              - { label: "Rất lớn (21px)", value: "21" }
          - label: "Font chữ nội dung"
            name: "fontFamily"
            widget: "select"
            required: false
            options:
              - { label: "Lora (có chân — mặc định)", value: "'Lora', serif" }
              - { label: "Inter (không chân)", value: "'Inter', sans-serif" }
              - { label: "JetBrains Mono (gõ máy)", value: "'JetBrains Mono', monospace" }
              - { label: "Georgia", value: "Georgia, serif" }
              - { label: "Arial", value: "Arial, Helvetica, sans-serif" }
      - label: "Nội dung bài viết"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "heading-one", "heading-two", "heading-three", "heading-four", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]
