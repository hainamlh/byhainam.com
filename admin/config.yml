backend:
  name: github
  repo: hainamlh/byhainam.com
  branch: main
  base_url: https://byhainam-oauth.hainamlh.workers.dev

# Nơi lưu ảnh khi anh chèn vào bài viết
media_folder: "uploads"
public_folder: "/uploads"

site_url: https://byhainam.com
display_url: https://byhainam.com
logo_url: /avatar.jpg

locale: "vi"

collections:
  - name: "letters"
    label: "Letters (Blog)"
    label_singular: "Bài viết"
    folder: "content/letters"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - label: "Nháp (chưa công bố)"
        field: draft
        pattern: true
      - label: "Đã công bố"
        field: draft
        pattern: false
    view_groups:
      - label: "Theo năm"
        field: date
        pattern: '\d{4}'
      - label: "Theo tháng"
        field: date
        pattern: '\d{4}-\d{2}'
    editor:
      preview: false
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - label: "Lưu nháp (bật = chỉ lưu ý tưởng, KHÔNG hiện trên web)"
        name: "draft"
        widget: "boolean"
        default: true
        required: false
        hint: "Bật = Lưu nháp, bài sẽ KHÔNG hiện trên web. Tắt = Công bố, bài hiện công khai. Bài đã công bố có thể bật lại để dừng công bố (gỡ khỏi web, không bị xoá nội dung)."
      - { label: "Ngày đăng", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Mô tả ngắn (hiện dưới tiêu đề & ở thẻ bài viết)", name: "dek", widget: "text" }
      - { label: "Thời gian đọc", name: "read", widget: "string", default: "3 phút đọc" }
      - label: "Hình ảnh tiêu đề (hiện ở thẻ bài viết ngoài trang chủ)"
        name: "image"
        widget: "image"
        required: false
        hint: "Nếu không chọn ảnh, trang chủ sẽ tự dùng icon + màu nền bên dưới."
      - label: "Màu thẻ minh hoạ"
        name: "bg"
        widget: "select"
        default: "light"
        options:
          - { label: "Tối (đen)", value: "dark" }
          - { label: "Sáng (trắng)", value: "light" }
          - { label: "Xanh lá nhạt", value: "light-green" }
          - { label: "Đỏ nhạt", value: "light-red" }
      - label: "Nội dung bài viết"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "heading-one", "heading-two", "heading-three", "heading-four", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]

  - name: "books"
    label: "Đọc sách"
    label_singular: "Cuốn sách"
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    view_groups:
      - label: "Theo năm"
        field: date
        pattern: '\d{4}'
    editor:
      preview: false
    fields:
      - { label: "Tên sách", name: "title", widget: "string" }
      - { label: "Ngày đăng", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: "Mô tả ngắn (hiện dưới tên sách & ở thẻ)", name: "dek", widget: "text" }
      - { label: "Ghi chú (vd: tác giả, thời lượng đọc)", name: "read", widget: "string", default: "Ghi chú đọc sách" }
      - label: "Ảnh bìa (hiện ở thẻ sách ngoài trang chủ)"
        name: "image"
        widget: "image"
        required: false
        hint: "Nếu không chọn ảnh, trang chủ sẽ tự dùng icon + màu nền bên dưới."
      - label: "Màu thẻ minh hoạ"
        name: "bg"
        widget: "select"
        default: "light"
        options:
          - { label: "Tối (đen)", value: "dark" }
          - { label: "Sáng (trắng)", value: "light" }
          - { label: "Xanh lá nhạt", value: "light-green" }
          - { label: "Đỏ nhạt", value: "light-red" }
      - label: "Ghi chú / cảm nhận về sách"
        name: "body"
        widget: "markdown"
        buttons: ["bold", "italic", "link", "heading-one", "heading-two", "heading-three", "heading-four", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]

  - name: "settings"
    label: "Cài đặt giao diện"
    editor:
      preview: false
    files:
      - label: "Giao diện toàn site"
        name: "theme"
        file: "content/settings.md"
        description: "Màu nền, màu chữ, cỡ chữ, font chữ áp dụng cho TOÀN BỘ website (trang chủ, danh sách bài viết, trang bài viết). Để trống mục nào thì dùng mặc định gốc của site."
        fields:
          - { label: "Màu nền toàn site", name: "siteBg", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Mặc định gốc: #000000" }
          - { label: "Màu chữ toàn site", name: "siteColor", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Mặc định gốc: #FFFFFF" }
          - label: "Cỡ chữ nội dung bài viết"
            name: "fontSize"
            widget: "select"
            required: false
            options:
              - { label: "Nhỏ (15px)", value: "15" }
              - { label: "Vừa (17px — mặc định)", value: "17" }
              - { label: "Lớn (19px)", value: "19" }
              - { label: "Rất lớn (21px)", value: "21" }
          - label: "Font chữ nội dung bài viết"
            name: "fontFamily"
            widget: "select"
            required: false
            hint: "Để trống = dùng Roboto (font mặc định hiện tại của toàn site)."
            options:
              - { label: "Roboto (mặc định)", value: "'Roboto', sans-serif" }
              - { label: "Quicksand (tròn, hiện đại)", value: "'Quicksand', sans-serif" }
              - { label: "Merriweather (có chân, báo chí)", value: "'Merriweather', serif" }
              - { label: "Raleway (thanh mảnh)", value: "'Raleway', sans-serif" }
              - { label: "Poppins (hình học, đậm)", value: "'Poppins', sans-serif" }
              - { label: "Lato", value: "'Lato', sans-serif" }
              - { label: "Lora (có chân, mềm mại)", value: "'Lora', serif" }
              - { label: "Georgia (có chân)", value: "Georgia, serif" }
              - { label: "Arial", value: "Arial, Helvetica, sans-serif" }
          - label: "Link Zalo (mục Cộng đồng ở trang chủ)"
            name: "zaloUrl"
            widget: "string"
            required: false
            hint: "Link nhóm/room Zalo. Bỏ trống thì icon Zalo không hiện."
          - label: "Icon mạng xã hội (hiện ở trang chủ + chân trang)"
            name: "socialLinks"
            widget: "list"
            required: false
            summary: "{{fields.platform}}"
            hint: "Thêm/bớt icon tại đây, kéo thả để đổi thứ tự. Bỏ trống Link thì icon đó không hiện."
            fields:
              - label: "Nền tảng"
                name: "platform"
                widget: "select"
                options:
                  - { label: "Substack", value: "substack" }
                  - { label: "Facebook", value: "facebook" }
                  - { label: "YouTube", value: "youtube" }
                  - { label: "TikTok", value: "tiktok" }
                  - { label: "X (Twitter)", value: "x" }
              - { label: "Link", name: "url", widget: "string", required: false }
          - label: "Văn bản cố định trên trang chủ"
            name: "homeTextsGroup"
            widget: "object"
            required: false
            collapsed: false
            hint: "Bỏ trống ô nào thì dùng mặc định gốc. Xuống dòng (Enter) trong ô = xuống dòng khi hiển thị."
            fields:
              - { label: "Tiêu đề Hero (dưới banner, đầu trang chủ)", name: "heroTitle", widget: "text", required: false, hint: "Mặc định: Tâm trí bình yên, vui vẻ / là điều quan trọng nhất." }
              - { label: "Đoạn mô tả dưới tiêu đề Hero", name: "heroDek", widget: "text", required: false }
              - { label: "Tiêu đề mục Blog", name: "blogHeading", widget: "text", required: false, hint: "Mặc định: Những suy nghĩ, chia sẻ, bài học / từ cuộc sống và giao dịch cổ phiếu" }
              - { label: "Tiêu đề mục Sách", name: "bookHeading", widget: "text", required: false, hint: "Mặc định: Những quyển sách về giao dịch, đầu tư / tôi đã đọc và tâm đắc" }
              - { label: "Tên (chữ ký cuối trang)", name: "signatureName", widget: "string", required: false, hint: "Mặc định: Hải Nam" }
              - { label: "Chức danh (chữ ký cuối trang)", name: "signatureRole", widget: "string", required: false, hint: "Mặc định: Giám đốc Tư vấn đầu tư · SSI" }
              - { label: "Câu tagline (chữ ký cuối trang)", name: "signatureTagline", widget: "text", required: false, hint: "Mặc định: Kỷ luật trước, lợi nhuận sau. Cảm ơn bạn đã đọc đến đây." }
