<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Letters by byhainam</title>
<meta name="description" content="{{DEK}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/Tiltle%20web.png">
<meta property="og:image" content="/Tiltle%20web.png">
<style>
{{SITE_STYLE}}
</style>
</head>
<body>

<div class="wrap">
  <nav class="nav">
    <a href="/" class="nav-brand">Hải Nam</a>
    <button class="nav-toggle" id="navToggle" aria-label="Mở menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="https://stock.byhainam.com" target="_blank">Stock</a>
      <a href="https://letters.byhainam.com">Letters</a>
      </div>
  </nav>
</div>

<article>
  <header class="post-hero">
    <div class="read">
      
      <div class="post-meta">
        <span>{{DATE_DISPLAY}}</span><span>·</span><span>{{READ}}</span>
      </div>
      <h1>{{TITLE}}</h1>
      <p class="post-dek">{{DEK}}</p>
      <div class="post-stats" data-slug="{{SLUG}}">
        <span class="post-stat" title="Lượt xem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="viewCount">{{VIEWS}}</span>
        </span>
        <button class="like-btn" id="likeBtn" title="Thích bài viết">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20.5s-7.5-4.6-10-9.2C.3 7.8 2 4 5.7 4c2 0 3.5 1 4.3 2.4C10.8 5 12.3 4 14.3 4 18 4 19.7 7.8 18 11.3c-2.5 4.6-10 9.2-10 9.2z"/></svg>
          <span id="likeCount">{{LIKES}}</span>
        </button>
      </div>
    </div>
  </header>

  <div class="post-body read">
{{BODY}}
  </div>

  {{RELATED}}
</article>

<footer class="footer">
  <div class="wrap footer-row">
    <div class="footer-links">
      <a href="https://stock.byhainam.com" target="_blank">STOCK</a>
      <a href="https://letters.byhainam.com">Letters</a>
      <a href="mailto:namnh3@ssi.com.vn">Email</a>
      <a href="tel:0947836679">0947 836 679</a>
    </div>
    <span class="footer-copy">© 2026 byhainam.com · Không phải khuyến nghị đầu tư</span>
  </div>
</footer>

<script>
  var t = document.getElementById('navToggle');
  var l = document.getElementById('navLinks');
  if (t && l) t.addEventListener('click', function(){ l.classList.toggle('open'); });
</script>
</body>
</html>
